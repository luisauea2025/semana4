<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema de Emprendimiento</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Menú Principal / Navbar de Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">🚀 Ecosistema Emprendedor</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Proyectos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Alerta Bootstrap para Mensajes de Éxito (Usa d-none para ocultarse al inicio) -->
        <div id="mensajeExito" class="alert alert-success alert-dismissible fade show d-none shadow-sm" role="alert">
            <strong>¡Excelente!</strong> El emprendimiento ha sido procesado y guardado correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Sistema de Rejilla: Fila Principal (row) -->
        <div class="row g-4">
            
            <!-- Columna del Formulario (Toma las 12 columnas en celular y 4 en pantallas grandes) -->
            <div class="col-12 col-lg-4">
                <div class="card shadow-sm border-0 p-4 rounded-3">
                    <h4 class="text-primary mb-3 fw-bold">Nuevo Registro</h4>
                    <form id="formulario">
                        
                        <div class="mb-3">
                            <label for="idEmprendimiento" class="form-label fw-semibold">ID Único</label>
                            <input type="number" class="form-control" id="idEmprendimiento" required placeholder="Ej: 101">
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre del Emprendimiento</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej: EcoTecnología">
                        </div>

                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-semibold">Categoría</label>
                            <input type="text" class="form-control" id="categoria" required placeholder="Ej: Tecnología, Gastronomía">
                        </div>

                        <!-- Botón mejorado con Spinner incluido -->
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" id="btnGuardar">
                            <span id="spinnerCarga" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
                            Guardar Emprendimiento
                        </button>
                    </form>
                </div>
            </div>

            <!-- Columna de la Tabla Dinámica (Toma las 12 columnas en celular y 8 en pantallas grandes) -->
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm border-0 p-4 rounded-3">
                    <h4 class="text-secondary mb-3 fw-bold">Emprendimientos Registrados</h4>
                    
                    <!-- Contenedor responsivo para tablas -->
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Emprendimiento</th>
                                    <th scope="col">Categoría</th>
                                    <th scope="col" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <!-- Aquí se inyectarán las filas dinámicamente desde el script.js -->
                            <tbody id="contenedorEmprendimientos"></tbody>
                        </table>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Modal Bootstrap para Visualizar Detalles -->
    <div class="modal fade" id="detalleModal" tabindex="-1" aria-labelledby="detalleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="detalleModalLabel">🔍 Información Detallada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body fs-5" id="modalContenido">
                    <!-- Contenido inyectado por JS -->
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Cerrar Ventana</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript de Bootstrap (Obligatorio para que funcionen la navbar móvil, los modales y las alertas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu archivo script.js -->
    <script src="script.js"></script>
</body>
</html>
