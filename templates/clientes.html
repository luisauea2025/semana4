{% extends "base.html" %}

{% block title %}Clientes - Sistema Integrado{% endblock %}

{% block content %}
<h2 class="mb-4">Registro de Clientes</h2>

<div class="row row-cols-1 row-cols-md-2 g-4">
    {% for c in clientes %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-primary">{{ c.nombre }}</h5>
                <h6 class="card-subtitle mb-3 text-muted">ID: {{ c.identificacion }}</h6>
                <p class="card-text mb-1"><strong>Email:</strong> {{ c.correo }}</p>
                <p class="card-text"><strong>Teléfono:</strong> {{ c.telefono }}</p>
            </div>
            <div class="card-footer bg-transparent border-0 text-end">
                <button class="btn btn-sm btn-outline-primary">Editar</button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
